{% extends "base.html" %}
{% block title %}Bad request{% endblock %}
{% block content %}
<section class="error-page">
  <p class="code">400</p>
  <h1>Bad request</h1>
  <p>{{ message or 'The request could not be understood. Please go back and try again.' }}</p>
  <p><a class="btn" href="{{ url_for('public.home') }}">Go to the home page</a></p>
</section>
{% endblock %}
