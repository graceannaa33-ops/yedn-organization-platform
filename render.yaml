# Render Blueprint for the YEDN platform (free plan, for public testing).
# Render reads this file when you choose "New > Blueprint" and connect the GitHub repository.
# Secrets are NOT stored here: SECRET_KEY is generated by Render, and values marked
# "sync: false" are typed into the Render dashboard when the Blueprint is created.
services:
  - type: web
    name: yedn-platform
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # Every start: apply migrations, (optionally) load demo data and create the admin, then serve.
    startCommand: flask --app app prepare-deploy && gunicorn wsgi:app --workers 2 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: yedn-db
          property: connectionString
      - key: FILE_STORAGE
        value: database          # Render free plan has no persistent disk
      - key: TRUST_PROXY
        value: "true"
      # ---- public testing ----
      - key: ALLOW_SANDBOX_PAYMENTS
        value: "true"            # simulated M-PESA, no real money
      - key: SEED_DEMO_DATA
        value: "true"            # load demo data once (safe to leave on; never loads twice)
      - key: SHOW_DEMO_LOGINS
        value: "false"           # do not print demo logins on the public login page
      - key: DEMO_PASSWORD
        sync: false              # you choose the password for the demo accounts
      - key: ADMIN_EMAIL
        sync: false              # your own Super Admin login
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: YEDN Administrator
      # ---- payments / messages (console mode until you have real accounts) ----
      - key: PAYMENT_PROVIDER
        value: sandbox
      - key: SMS_PROVIDER
        value: console
      - key: ORGANIZATION_NAME
        value: "Youth Enterprise & Development Network"

databases:
  - name: yedn-db
    plan: free
    region: frankfurt
    databaseName: yedn
    user: yedn
